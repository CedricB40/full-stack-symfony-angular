<div class="login-container">

  <div class="login-card">

    <h2>Connexion</h2>

    <label>Email</label>

    <input
      type="email"
      [(ngModel)]="email"
      placeholder="Votre email"
    >

    <label>Mot de passe</label>

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Votre mot de passe"
    >

    <button (click)="login()">
      Se connecter
    </button>

  </div>

</div>
